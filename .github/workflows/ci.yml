name: Laravel CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_ENV: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, mysql

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # 1. Syntax check
      - name: PHP Syntax Check
        run: find . -path ./vendor -prune -o -type f -name "*.php" -print | xargs -P 4 -n 1 php -l

      # 2. Code style formatting
      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      # 3. Static analysis
      # - name: Static analysis (Larastan)
      #   run: ./vendor/bin/phpstan analyse --level=max

      # 4. Migrate and seed database
      - name: Run migrations and seeds
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      # 5. Run tests
      - name: Run tests
        run: php artisan test --no-tty

      # 6. Security audit
      - name: Run security audit
        run: composer audit

      # 7. Deploy to Hostinger on push to main
      - name: Deploy to Hostinger
        if: github.ref == 'refs/heads/main' && success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.60.93.25
          username: u536565195
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: 65002
          script: |
            # Remplacez le chemin ci-dessous par le chemin réel de votre projet sur Hostinger
            cd /home/u536565195/domains/newdayassociation.org/public_html

            # Mise à jour du code
            git pull origin main

            # Installation des dépendances (sans dev)
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Migrations et maintenance
            php artisan down
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan up
